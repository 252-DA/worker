[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-worker"
version = "0.1.0"
description = "Async document processing workers for the chunking pipeline"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "document-chunk[embeddings,remote-embedding,ocr]",
    "ai-runtime-sdk[gemini,openai]",
    "bullmq>=2.0.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.0.0",
    # torch is transitive via document-chunk[embeddings] — listed directly
    # so tool.uv.sources.torch below actually applies, see
    # embedding-service/pyproject.toml for the full explanation.
    "torch",
    # torchvision (transitive via docling → transformers image processors) must
    # come from the same CPU index as torch: the PyPI build is compiled against
    # the default torch and fails with "operator torchvision::nms does not
    # exist" next to torch+cpu, which breaks docling OCR/layout on image pages.
    "torchvision",
]

[project.scripts]
document-worker = "worker.runners.document_worker:main"
enrichment-worker = "worker.runners.enrichment_worker:main"
outbox-worker = "worker.runners.outbox_worker:main"
content-generation-worker = "worker.runners.content_generation_worker:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
document-chunk = { path = "../packages-ai", editable = true }
ai-runtime-sdk = { path = "../ai-sdk", editable = true }
da-service-sdk = { path = "../service-sdk", editable = true }
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-v --cov=worker --cov-report=term-missing"
