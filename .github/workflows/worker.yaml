name: worker

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Image ~9GB (torch/docling) vượt quota GHCR private free (500MB) →
# CI chỉ BUILD để validate Dockerfile, chưa push. Khi slim image xong
# (torch CPU-only, multi-stage) thì chọn registry và bật push lại
# (cần thêm permissions: packages: write + bước docker/login-action).
permissions:
  contents: read

env:
  IMAGE: ghcr.io/252-da/worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Tái tạo layout ~/DA: worker/, packages-ai/, ai-sdk/ và service-sdk/ nằm cạnh nhau
      - uses: actions/checkout@v4
        with:
          path: worker

      - uses: 252-DA/core-chunking/.github/actions/materialize@d325fc4582c161e4dbfc84c60364e1f0d8640d9c
        with:
          path: packages-ai

      - uses: 252-DA/ai-sdk/.github/actions/materialize@e4fc97d87e23b3a63eab53c489e325bdc117f923
        with:
          path: ai-sdk

      # service-sdk chưa có repo riêng — lấy từ thư mục service-sdk/ của da-platform
      - uses: 252-DA/da-platform/service-sdk/.github/actions/materialize@dfd4b0b9db9c7320865ac55541530c623c0cf1c8
        with:
          path: service-sdk

      - uses: astral-sh/setup-uv@v5

      - name: Install deps
        working-directory: worker
        run: uv sync --frozen --python 3.10

      - name: Run unit tests
        working-directory: worker
        run: uv run pytest tests/unit -q

  build-image:
    # PR chỉ cần test; build+push image chỉ khi code thật sự vào master
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: worker

      - uses: 252-DA/core-chunking/.github/actions/materialize@d325fc4582c161e4dbfc84c60364e1f0d8640d9c
        with:
          path: packages-ai

      - uses: 252-DA/ai-sdk/.github/actions/materialize@e4fc97d87e23b3a63eab53c489e325bdc117f923
        with:
          path: ai-sdk

      # service-sdk chưa có repo riêng — lấy từ thư mục service-sdk/ của da-platform
      - uses: 252-DA/da-platform/service-sdk/.github/actions/materialize@dfd4b0b9db9c7320865ac55541530c623c0cf1c8
        with:
          path: service-sdk

      - uses: docker/build-push-action@v6
        with:
          # context = workspace root (chứa cả worker/ lẫn packages-ai/) — đúng thiết kế Dockerfile
          context: .
          file: worker/Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
